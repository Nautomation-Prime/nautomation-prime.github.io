name: Deploy MkDocs (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for git-revision-date-localized plugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail fast on broken internal links, missing pages in nav, etc.
      - name: Build (strict)
        run: mkdocs build --strict

      # Ensure CNAME is always present in the published site (gh-pages root).
      # This makes the custom domain setup robust even if repo settings are changed/reset.
      - name: Add CNAME to site output
        run: |
          echo "www.nautomationprime.io" > site/CNAME

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force
