site_name: Nautomation Prime
site_description: Enterprise Cisco Python Automation, Explained Line-by-Line.
site_url: https://www.nautomationprime.io/
site_author: Christopher Davies
repo_url: https://github.com/Nautomation-Prime/Nautomation-Prime.github.io
repo_name: GitHub
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  favicon: assets/favicon.ico
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking  # Track visited pages
    - navigation.indexes  # Enable index pages for sections
    - content.code.copy
    - content.code.annotate  # Enable code annotations
    - content.tooltips
    - search.share
    - search.suggest
    - search.highlight
    - search.stemmer
    - announce.dismiss  # Allow dismissing announcements

  palette:
    scheme: default
    primary: blue
    accent: blue

copyright: >
  © 2026 Christopher Davies T/A Nautomation Prime — Not affiliated with Cisco Systems, Inc.<br>
  Empowering Network Automation Professionals · Built with Material for MkDocs

extra:
  metadata:
    keywords: "Cisco automation, Python network automation, Nautomation Prime, network scripting"
  generator: false  # Removes default "Made with Material for MkDocs" (we added custom attribution above)
  status:
    new: Recently added
    deprecated: Deprecated
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  footer_links:
    - title: "Privacy Policy"
      url: "/legal/privacy-policy/"
    - title: "Terms of Use"
      url: "/legal/terms-of-use/"
    - title: "Disclaimer"
      url: "/legal/disclaimer/"
    - title: "Licensing"
      url: "/legal/licensing/"
    - title: "Brand Usage"
      url: "/legal/brand/"
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/nautomationprime
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/Nautomation-Prime
      name: GitHub
    - icon: material/email
      link: "mailto:nautomationprime.f3wfe@simplelogin.com"
      name: Contact Nautomation Prime


extra_css:
  - assets/css/custom.css

markdown_extensions:
  - abbr  # Enable abbreviations/glossary
  - admonition  # Call-out boxes (notes, warnings, tips)
  - attr_list
  - def_list  # Definition lists
  - footnotes  # Footnote support
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret  # Superscript (^) and insert (^^)
  - pymdownx.mark  # Highlighting (==text==)
  - pymdownx.tilde  # Strikethrough (~~text~~) and subscript (~)
  - pymdownx.critic  # Track changes
  - pymdownx.keys  # Keyboard keys (++ctrl+alt+del++)
  - pymdownx.smartsymbols  # Smart symbols (copyright, arrows, etc.)
  - pymdownx.icon
  - pymdownx.emoji:  # Enable emoji support
    emoji_index: !!python/name:materialx.emoji.twemoji
    emoji_generator: !!python/name:materialx.emoji.to_svg
  
  - pymdownx.highlight:
      use_pygments: true      
      linenums: true
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.inlinehilite
  - pymdownx.snippets  # Include content from other files
  - pymdownx.tasklist:  # Task lists with checkboxes
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - tables
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Resources: resources.md
  - Learning:
      - Tutorials: tutorials/index.md
      - Beginner Tutorials:
          - tutorials/beginner/index.md
          - Multi-Device Config Backup: tutorials/beginner/multi-device-config-backup.md
          - Multi-Device Show Command: tutorials/beginner/multi-device-show-command.md
          - Netmiko Show Command to Excel: tutorials/beginner/netmiko-show-command-to-excel.md
      - Intermediate Tutorials:
          - tutorials/intermediate/index.md
          - Advanced Nornir Patterns: tutorials/intermediate/advanced-nornir-patterns.md
          - Building Reliable Automation with PyATS: tutorials/intermediate/building-reliable-automation-with-pyats.md
          - Enterprise Config Backup Nornir: tutorials/intermediate/enterprise-config-backup-nornir.md
          - Nornir Fundamentals: tutorials/intermediate/nornir-fundamentals.md
          - PyATS Fundamentals: tutorials/intermediate/pyats-fundamentals.md
          - PyATS Network Validation: tutorials/intermediate/pyats-network-validation.md
          - Why Nornir: tutorials/intermediate/why-nornir.md
      - Expert Tutorials:
          - tutorials/expert/index.md
          - Nornir + PyATS Integration: tutorials/expert/nornir-pyats-integration.md
          - Asyncio for Network Automation: tutorials/expert/asyncio-network-automation.md
          - Secure Credential Vaulting: tutorials/expert/secure-credential-vaulting.md
          - DevOps & Observability: tutorials/expert/devops-observability-network-automation.md
          - Tool Ecosystem Integration: tutorials/expert/tool-ecosystem-integration.md
      - Deep Dives:
          - deep-dives/index.md
          - Access Switch Audit: deep-dives/access-switch-audit.md
          - CDP Audit: deep-dives/cdp-audit.md
      - Scripts: scripts/index.md
  - Blog:
      - blog/index.md
  - Coming Soon:
      - coming-soon/index.md
      - Cisco IOS XE ZTP: coming-soon/cisco-ios-xe-ztp.md
      - IOS XE Upgrade Orchestrator: coming-soon/ios-xe-upgrade-orchestrator.md
      - ZTP Automation Platform: coming-soon/ztp-automation-platform.md
  - Services:
      - services.md
      - how-we-work.md
  - PRIME Framework:
      - prime-framework/index.md
      - Pinpoint: prime-framework/pinpoint.md
      - Implement: prime-framework/implement.md
      - Measure: prime-framework/measure.md
      - Empower: prime-framework/empower.md
      - Re-Engineer: prime-framework/re-engineer.md
      - Philosophy: prime-framework/philosophy.md
  - About:
      - about.md
      - founder.md
      - Legal:
          - legal/brand.md
          - legal/disclaimer.md
          - legal/licensing.md
          - legal/privacy-policy.md
          - legal/terms-of-use.md

plugins:
  - mermaid2
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      lang: en
  - tags  # Enable tags for content categorization
  - git-revision-date-localized:
      enable_creation_date: false  # Only show "last updated", not creation date
      type: date
      fallback_to_build_date: true
      enable_git_follow: false  # Disable to avoid quirks with new files
      strict: false  # Don't show warnings for files without git logs
  - blog:
      archive: false

